syntax = "proto3";

import "google/protobuf/timestamp.proto";

// Server -> device command/assignment contract.
//
// SailRoute replies to device-initiated UDP telemetry with a ServerReply on the
// same socket. All commands are versioned, idempotent, and safe to receive more
// than once. The device acknowledges applied commands via CommandAck on its
// telemetry/heartbeat uploads (see data_set.proto).
//
// First-cut shared contract grounded in the SailRoute transition plan's
// "Race Assignment Payload Contract" and server-side command set.

// Telemetry sample modes the device can be commanded into.
enum SampleMode {
  SAMPLE_MODE_UNSPECIFIED = 0;
  SAMPLE_MODE_OUTING_1HZ = 1;
  SAMPLE_MODE_RACE_5HZ = 2;
  SAMPLE_MODE_EVENT_10HZ = 3;
}

// Race phases used to pick sampling and event windows.
enum RacePhase {
  RACE_PHASE_UNSPECIFIED = 0;
  RACE_PHASE_IDLE = 1;
  RACE_PHASE_PRE_START = 2;
  RACE_PHASE_RACING = 3;
  RACE_PHASE_ROUNDING = 4;
  RACE_PHASE_FINISH = 5;
  RACE_PHASE_COMPLETE = 6;
}

enum MarkRounding {
  MARK_ROUNDING_UNSPECIFIED = 0;
  MARK_ROUNDING_PORT = 1;
  MARK_ROUNDING_STARBOARD = 2;
  MARK_ROUNDING_GATE = 3;
}

message LatLon {
  double latitude = 1;   // degrees
  double longitude = 2;  // degrees
}

// A line (start/finish) defined by its two endpoints.
message LineGeometry {
  LatLon end_a = 1;
  LatLon end_b = 2;
}

message CourseMark {
  string code = 1;            // e.g. "1", "1a", "WL", "F"
  LatLon position = 2;
  MarkRounding rounding = 3;
  uint32 sequence = 4;        // order in the course
}

// Which sample mode applies per race phase, plus event-window parameters the
// device uses to switch rates autonomously.
message SamplingRules {
  SampleMode default_mode = 1;        // non-race default (outing_1hz)
  SampleMode race_mode = 2;           // active race (race_5hz)
  SampleMode event_mode = 3;          // start/rounding/finish windows (event_10hz)
  uint32 start_window_seconds = 4;    // event window around official start
  uint32 mark_proximity_meters = 5;   // distance to a mark that triggers event_mode
  uint32 finish_window_seconds = 6;   // event window approaching finish
}

// Top-level server -> device reply envelope.
message ServerReply {
  uint32 protocol_version = 1;
  string device_id = 2;        // target device; the device ignores mismatches
  DeviceCommand command = 3;
}

message DeviceCommand {
  string command_id = 1;          // globally unique, idempotent (server-assigned)
  string assignment_id = 2;       // assignment this command pertains to
  uint32 assignment_version = 3;  // monotonic; device ignores already-applied versions
  string assignment_hash = 4;     // hash of the assignment payload for integrity/idempotency
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;  // device returns to defaults after expiry

  oneof payload {
    NoopCommand noop = 16;
    RaceAssignment race_assignment = 17;
    RouteUpdate route_update = 18;
    ActiveWaypointUpdate active_waypoint_update = 19;
    CancelAssignment cancel_assignment = 20;
    ManifestVerificationResult manifest_verification_result = 21;
    MissingChunkRequest missing_chunk_request = 22;
    ServerTimeConfig server_time_config = 23;
  }
}

message NoopCommand {}

message RaceAssignment {
  string boat_id = 1;
  string device_id = 2;
  string race_plan_id = 3;
  string race_session_id = 4;
  string race_recording_id = 5;            // mirrors the device archive id (YYYY-MM-DD-N)
  google.protobuf.Timestamp official_start_time = 6;
  uint32 expected_duration_seconds = 7;
  LineGeometry start_line = 8;
  LineGeometry finish_line = 9;
  repeated CourseMark course_marks = 10;
  bool shortened_course = 11;
  string shortened_final_mark_code = 12;   // when shortened, which mark became final
  string active_mark_code = 13;            // next mark to round
  SamplingRules sampling_rules = 14;
  string route_request_id = 15;            // optional, when an optimized route exists
  repeated LatLon route_geometry = 16;     // optional optimized route
  string route_hash = 17;                  // optional
}

message RouteUpdate {
  string route_request_id = 1;
  repeated LatLon route_geometry = 2;      // remaining route only
  string route_hash = 3;
  string active_mark_code = 4;
}

message ActiveWaypointUpdate {
  string active_mark_code = 1;
}

message CancelAssignment {
  string reason = 1;
}

message ManifestVerificationResult {
  string race_recording_id = 1;
  bool complete = 2;
  repeated string missing_chunk_ids = 3;   // populated when not complete
}

message MissingChunkRequest {
  string race_recording_id = 1;
  repeated string chunk_ids = 2;
}

message ServerTimeConfig {
  google.protobuf.Timestamp server_time = 1;
}
